const MSG_LIMIT = 50;

let _sb = null;
const sb = () => {
  if (!_sb) _sb = supabase.createClient(SB_URL, SB_KEY);
  return _sb;
};

const loadMessages = async (username, leagueId) => {
  if (!username || !leagueId) return [];
  const { data, error } = await sb()
    .from("dynasty_messages")
    .select("role, content, created_at")
    .eq("username", username)
    .eq("league_id", leagueId)
    .order("created_at", { ascending: true })
    .limit(MSG_LIMIT);
  if (error) { console.error("Load messages error:", error); return []; }
  return data || [];
};

const saveMessage = async (username, leagueId, role, content) => {
  if (!username || !leagueId) return;
  const { error } = await sb()
    .from("dynasty_messages")
    .insert({ username, league_id: leagueId, role, content });
  if (error) console.error("Save message error:", error);
};

const SYSTEM_PROMPT = [
  "You are an expert dynasty fantasy football advisor. You combine deep NFL player valuation knowledge, roster construction strategy, and long-term dynasty team building expertise.",
  "",
  "CORE RULES:",
  "- Every recommendation prioritizes long-term dynasty value unless explicitly asked for redraft/weekly takes",
  "- Age curves matter. A 28-year-old RB and a 22-year-old RB are fundamentally different assets",
  "- Rookie picks have value. Factor pick capital into all evaluations",
  "- Positional scarcity varies by format. In Superflex, QBs are scarce premium assets. In TE Premium, elite TEs carry outsized value",
  "- Assess contention windows objectively. If the data says they're not a real contender, say so directly",
  "- Be the user's most honest advisor, not most agreeable. Stress-test their ideas, find flaws, flag risks",
  "- When advising on trades, present two options: Aggressive (maximize upside, accept more risk) and Neutral (balanced, protect floor)",
  "- Lead with a clear recommendation, then explain reasoning",
  "- Keep responses focused and direct. No padding.",
  "- Use the league context provided to calibrate every answer to the specific format, size, and scoring."
].join("\n");

// ─── API HELPERS ────────────────────────────────────────────
const sfetch = async (path) => {
  const r = await fetch(SLEEPER + path);
  if (!r.ok) throw new Error("Sleeper API error: " + r.status);
  return r.json();
};

const callClaude = async (messages, apiKey) => {
  if (!apiKey) throw new Error("No API key set. Go to Settings to add your Anthropic key.");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 1500, system: SYSTEM_PROMPT, messages }),
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e?.error?.message || "Claude API error: " + r.status);
  }
  const d = await r.json();
  return d.content?.map(b => b.text || "").join("\n") || "No response.";
};

// ─── DATA UTILS ─────────────────────────────────────────────
const fmtLeague = (s, rp) => ({
  format: rp?.includes("SUPER_FLEX") ? "Superflex" : "1QB",
  scoring: s?.rec === 1 ? "PPR" : s?.rec === 0.5 ? "Half PPR" : "Standard",
});

const pInfo = (id, pc) => {
  if (!pc || !id) return { name: "ID:" + id, pos: "??", team: "??", age: null };
  const p = pc[id];
  if (!p) return { name: "ID:" + id, pos: "??", team: "??", age: null };
  return { name: ((p.first_name||"") + " " + (p.last_name||"")).trim() || "ID:"+id, pos: p.position||"??", team: p.team||"FA", age: p.age||null, injury: p.injury_status||null };
};

const teamName = (users, oid) => {
  const u = users?.find(x => x.user_id === oid);
  return u?.metadata?.team_name || u?.display_name || "Unknown";
};

const standings = (rosters, users) => {
  if (!rosters?.length) return [];
  return rosters.map(r => ({
    ownerId: r.owner_id, team: teamName(users, r.owner_id),
    wins: r.settings?.wins||0, losses: r.settings?.losses||0, ties: r.settings?.ties||0,
    pf: ((r.settings?.fpts||0) + (r.settings?.fpts_decimal||0)/100).toFixed(1),
    rosterId: r.roster_id,
  })).sort((a,b) => b.wins-a.wins || parseFloat(b.pf)-parseFloat(a.pf))
    .map((s,i) => ({...s, rank: i+1, record: s.wins+"-"+s.losses+(s.ties?"-"+s.ties:"")}));
};

const leagueCtx = (lg, st, ur, pc) => {
  if (!lg) return "";
  const {format, scoring} = fmtLeague(lg.scoring_settings, lg.roster_positions);
  const rp = (ur?.players||[]).map(id => { const p=pInfo(id,pc); return p.name+" ("+p.pos+", "+p.team+", age "+(p.age||"?")+")"; });
  const t8 = st.slice(0,8).map(s => "#"+s.rank+" "+s.team+": "+s.record+" ("+s.pf+" PF)");
  return "<league_context>\nLeague: "+lg.name+"\nFormat: "+format+", "+lg.total_rosters+"-team, "+scoring+"\nRoster Slots: "+(lg.roster_positions||[]).join(", ")+"\nSeason: "+SEASON+"\n\nMy Roster:\n"+rp.join("\n")+"\n\nStandings (top 8):\n"+t8.join("\n")+"\n</league_context>";
};

// ─── HOME ───────────────────────────────────────────────────
const Home = ({lg,st,ur,pc,apiKey,username}) => {
  const [inp,setInp] = useState("");
  const [msgs,setMsgs] = useState([]);
  const [busy,setBusy] = useState(false);
  const [histLoading,setHistLoading] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    if (!lg || !username) return;
    setHistLoading(true);
    loadMessages(username, lg.league_id).then(history => {
      if (history.length > 0) {
        setMsgs(history);
      } else {
        setMsgs([{role:"assistant", content:"Welcome to the Dynasty Advisor. I've loaded your **"+lg.name+"** league — "+lg.total_rosters+"-team "+lg._fmt+" "+lg._scr+". What do you want to work on?"}]);
      }
      setHistLoading(false);
    });
  }, [lg?.league_id, username]);
  useEffect(() => { endRef.current?.scrollIntoView({behavior:"smooth"}); }, [msgs]);

  const send = useCallback(async () => {
    if (!inp.trim()||busy) return;
    const q = inp.trim(); setInp(""); setMsgs(m=>[...m,{role:"user",content:q}]); setBusy(true);
    saveMessage(username, lg.league_id, "user", q);
    try {
      const ctx = leagueCtx(lg,st,ur,pc);
      const hist = msgs.filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content}));
      hist.push({role:"user",content:ctx+"\n\nUser question: "+q});
      const reply = await callClaude(hist, apiKey);
      setMsgs(m=>[...m,{role:"assistant",content:reply}]);
      saveMessage(username, lg.league_id, "assistant", reply);
    } catch(e) { setMsgs(m=>[...m,{role:"assistant",content:"Error: "+e.message}]); }
    finally { setBusy(false); }
  }, [inp,busy,lg,st,ur,pc,msgs,apiKey,username]);

  const me = st.find(s=>s.ownerId===ur?.owner_id);
  if (!lg) return <Empty title="No league selected" desc="Go to Settings to connect"/>;

// ─── ROSTER ─────────────────────────────────────────────────
const Roster = ({ur,pc}) => {
  const grp = useMemo(() => {
    if (!ur?.players||!pc) return {};
    const g = {};
    ur.players.forEach(id => { const p=pInfo(id,pc); const pos=p.pos||"??"; if(!g[pos])g[pos]=[]; g[pos].push({...p,id}); });
    const order=["QB","RB","WR","TE","K","DEF","DL","LB","DB"]; const sorted={};
    order.forEach(pos=>{if(g[pos])sorted[pos]=g[pos];}); Object.keys(g).forEach(pos=>{if(!sorted[pos])sorted[pos]=g[pos];});
    return sorted;
  }, [ur,pc]);

  if (!ur) return <Empty title="No roster data" desc="Select a league to view your roster"/>;

  return <div style={{display:"flex",flexDirection:"column",gap:20}}>
    <div style={{fontFamily:FONT,fontSize:20,fontWeight:700,color:C.text}}>Roster</div>
    {Object.entries(grp).map(([pos,pls])=><div key={pos}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><PosBadge pos={pos}/><span style={{fontFamily:MONO,fontSize:11,color:C.textMute}}>{pls.length}</span></div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {pls.map((p,i)=><div key={i} style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            <span style={{fontFamily:FONT,fontSize:14,fontWeight:600,color:C.text}}>{p.name}</span>
            <div style={{display:"flex",gap:8}}><span style={{fontFamily:MONO,fontSize:11,color:C.textSec}}>{p.team}</span>{p.age&&<span style={{fontFamily:MONO,fontSize:11,color:C.textMute}}>Age {p.age}</span>}</div>
          </div>
          {p.injury&&<span style={{fontFamily:MONO,fontSize:9,color:C.red,background:C.redDim,padding:"2px 6px",borderRadius:4}}>{p.injury}</span>}
        </div>)}
      </div>
    </div>)}
  </div>;
};

// ─── MATCHUP ────────────────────────────────────────────────
const Matchup = ({lg,ur,rosters,lusers,pc}) => {
  const [mups,setMups] = useState(null);
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState(null);
  const wk = lg?.settings?.leg||1;
  const load = useCallback(()=>{if(!lg)return; setLoading(true);setErr(null); sfetch("/league/"+lg.league_id+"/matchups/"+wk).then(setMups).catch(e=>setErr(e.message)).finally(()=>setLoading(false));},[lg?.league_id,wk]);
  useEffect(load,[load]);

  const data = useMemo(()=>{
    if(!mups||!ur||!rosters||!pc)return null;
    const my=mups.find(m=>m.roster_id===ur.roster_id); if(!my)return null;
    const opp=mups.find(m=>m.matchup_id===my.matchup_id&&m.roster_id!==ur.roster_id); if(!opp)return null;
    const or=rosters.find(r=>r.roster_id===opp.roster_id);
    const build=m=>(m.starters||[]).map(id=>({...pInfo(id,pc),pts:(m.players_points?.[id]||0).toFixed(1)}));
    return {you:{team:"My Team",pts:(my.points||0).toFixed(1),players:build(my)},opp:{team:teamName(lusers,or?.owner_id),pts:(opp.points||0).toFixed(1),players:build(opp)}};
  },[mups,ur,rosters,lusers,pc]);

  if(!lg)return <Empty title="No league" desc="Select a league"/>;
  if(loading)return <div style={{display:"flex",justifyContent:"center",padding:40}}><Spin/></div>;
  if(err)return <ErrBox msg={err} onRetry={load}/>;
  if(!data)return <Empty title="No matchup found" desc="Matchup data isn't available yet"/>;

  const yp=parseFloat(data.you.pts), op=parseFloat(data.opp.pts), win=yp>=op;
  const Side=({side,isU})=><div style={{flex:1,minWidth:0}}>
    <div style={{textAlign:"center",marginBottom:12}}>
      <div style={{fontFamily:FONT,fontSize:13,fontWeight:600,color:isU?C.accent:C.text,marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{side.team}</div>
      <div style={{fontFamily:MONO,fontSize:22,fontWeight:800,color:isU?C.accent:C.text}}>{side.pts}</div>
      <div style={{fontFamily:MONO,fontSize:9,color:C.textMute,textTransform:"uppercase",letterSpacing:1}}>Points</div>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {side.players.map((p,i)=><div key={i} style={{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:"8px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}><PosBadge pos={p.pos}/><span style={{fontFamily:FONT,fontSize:12,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span></div>
        <span style={{fontFamily:MONO,fontSize:12,fontWeight:600,color:C.textSec,flexShrink:0,marginLeft:6}}>{p.pts}</span>
      </div>)}
    </div>
  </div>;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontFamily:FONT,fontSize:20,fontWeight:700,color:C.text}}>Matchup</div>
      <span style={{fontFamily:MONO,fontSize:10,color:C.textSec,background:C.card,padding:"4px 10px",borderRadius:6,border:"1px solid "+C.border}}>Week {wk}</span>
    </div>
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:"16px 20px",display:"flex",justifyContent:"center",alignItems:"center",gap:24,marginBottom:16}}>
      <div style={{textAlign:"center"}}><div style={{fontFamily:MONO,fontSize:28,fontWeight:800,color:win?C.green:C.text}}>{data.you.pts}</div><div style={{fontFamily:MONO,fontSize:9,color:C.textMute,letterSpacing:1,textTransform:"uppercase"}}>You</div></div>
      <div style={{fontFamily:MONO,fontSize:12,color:C.textMute,fontWeight:600}}>vs</div>
      <div style={{textAlign:"center"}}><div style={{fontFamily:MONO,fontSize:28,fontWeight:800,color:!win?C.green:C.text}}>{data.opp.pts}</div><div style={{fontFamily:MONO,fontSize:9,color:C.textMute,letterSpacing:1,textTransform:"uppercase"}}>Opp</div></div>
    </div>
    <div style={{display:"flex",gap:8}}><Side side={data.you} isU/><Side side={data.opp} isU={false}/></div>
  </div>;
};

// ─── TRADES ─────────────────────────────────────────────────
const Trades = ({lg,rosters,lusers,ur,pc,st,apiKey}) => {
  const [sec,setSec] = useState("builder");
  const [txs,setTxs] = useState([]); const [txL,setTxL] = useState(false);
  const [myP,setMyP] = useState([]); const [oppT,setOppT] = useState(null); const [oppP,setOppP] = useState([]);
  const [res,setRes] = useState(null); const [ana,setAna] = useState(false);
  const [picker,setPicker] = useState(null);

  useEffect(()=>{if(!lg||sec!=="activity")return;setTxL(true);sfetch("/league/"+lg.league_id+"/transactions/"+(lg.settings?.leg||1)).then(setTxs).catch(()=>setTxs([])).finally(()=>setTxL(false));},[lg?.league_id,sec]);

  const myPlayers = useMemo(()=>{
    if(!ur?.players||!pc)return [];
    return ur.players.map(id=>({id,...pInfo(id,pc)})).sort((a,b)=>{const o={QB:0,RB:1,WR:2,TE:3};return(o[a.pos]??9)-(o[b.pos]??9);});
  },[ur,pc]);

  const oppTeams = useMemo(()=>{
    if(!rosters||!lusers||!ur)return [];
    return rosters.filter(r=>r.roster_id!==ur.roster_id).map(r=>({
      id:r.roster_id,rosterId:r.roster_id,ownerId:r.owner_id,name:teamName(lusers,r.owner_id),
      players:(r.players||[]).map(pid=>({id:pid,...pInfo(pid,pc)})).sort((a,b)=>{const o={QB:0,RB:1,WR:2,TE:3};return(o[a.pos]??9)-(o[b.pos]??9);}),
    }));
  },[rosters,lusers,ur,pc]);

  const tog=(list,set,it)=>set(p=>p.find(x=>x.id===it.id)?p.filter(x=>x.id!==it.id):[...p,it]);

  const analyze = useCallback(async()=>{
    if(!myP.length||!oppP.length)return; setAna(true);setRes(null);
    try{
      const ctx=leagueCtx(lg,st,ur,pc);
      const ms=myP.map(p=>p.name+" ("+p.pos+", "+p.team+")").join(", ");
      const ts=oppP.map(p=>p.name+" ("+p.pos+", "+p.team+")").join(", ");
      const prompt=ctx+"\n\nAnalyze this trade:\nI send: "+ms+"\nI receive: "+ts+"\n\nGive two options: Aggressive and Neutral. For each, state who wins and why. Factor dynasty value, age, positional scarcity for this league format, and my roster construction.";
      const reply = await callClaude([{role:"user",content:prompt}], apiKey);
      setRes(reply);
    }catch(e){setRes("Error: "+e.message);}
    finally{setAna(false);}
  },[myP,oppP,lg,st,ur,pc,apiKey]);

  const fmtTx=tx=>{
    const adds=Object.keys(tx.adds||{}).map(id=>pInfo(id,pc).name);
    const drops=Object.keys(tx.drops||{}).map(id=>pInfo(id,pc).name);
    if(tx.type==="trade")return"Trade: "+[...adds,...drops].slice(0,4).join(", ")+(adds.length+drops.length>4?"...":"");
    const p=[];if(adds.length)p.push("Added "+adds.join(", "));if(drops.length)p.push("Dropped "+drops.join(", "));return p.join(" · ")||"Transaction";
  };

  if(!lg)return <Empty title="No league" desc="Select a league"/>;

  return <div>
    <div style={{fontFamily:FONT,fontSize:20,fontWeight:700,color:C.text,marginBottom:16}}>Trades</div>
    <div style={{display:"flex",gap:4,marginBottom:16,background:C.card,borderRadius:10,padding:4,border:"1px solid "+C.border}}>
      {["builder","activity"].map(s=><button key={s} onClick={()=>setSec(s)} style={{flex:1,background:sec===s?C.accentDim:"transparent",border:sec===s?"1px solid "+C.accentBorder:"1px solid transparent",borderRadius:8,padding:"10px 0",cursor:"pointer",fontFamily:MONO,fontSize:11,fontWeight:600,color:sec===s?C.accent:C.textMute,textTransform:"uppercase",letterSpacing:1}}>{s==="builder"?"Trade Builder":"Activity"}</button>)}
    </div>

    {sec==="builder"?<div>
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:MONO,fontSize:10,color:C.textMute,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Your Players</div>
        <button onClick={()=>setPicker("my")} style={{width:"100%",background:C.card,border:"1px dashed "+C.accentBorder,borderRadius:10,padding:myP.length?"10px 14px":20,textAlign:myP.length?"left":"center",cursor:"pointer",color:C.text,fontFamily:FONT}}>
          {myP.length?<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{myP.map(p=><span key={p.id} style={{fontFamily:MONO,fontSize:11,color:C.accent,background:C.accentDim,padding:"4px 8px",borderRadius:6}}>{p.name}</span>)}</div>
          :<><div style={{fontSize:13,color:C.textSec,marginBottom:4}}>Tap to select players to trade away</div><div style={{fontFamily:MONO,fontSize:10,color:C.textMute}}>Players from your roster</div></>}
        </button>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:MONO,fontSize:10,color:C.textMute,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Trade Partner</div>
        <button onClick={()=>setPicker("team")} style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"12px 16px",cursor:"pointer",color:oppT?C.text:C.textSec,fontFamily:FONT,fontSize:14,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>{oppT?.name||"Select an opponent..."}</span><Ico d={I.chevron} size={16} color={C.textMute}/>
        </button>
      </div>
      {oppT&&<div style={{marginBottom:16}}>
        <div style={{fontFamily:MONO,fontSize:10,color:C.textMute,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Their Players</div>
        <button onClick={()=>setPicker("opp")} style={{width:"100%",background:C.card,border:"1px dashed "+C.borderLight,borderRadius:10,padding:oppP.length?"10px 14px":20,textAlign:oppP.length?"left":"center",cursor:"pointer",color:C.text,fontFamily:FONT}}>
          {oppP.length?<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{oppP.map(p=><span key={p.id} style={{fontFamily:MONO,fontSize:11,color:C.blue,background:C.blueDim,padding:"4px 8px",borderRadius:6}}>{p.name}</span>)}</div>
          :<><div style={{fontSize:13,color:C.textSec,marginBottom:4}}>Tap to select players to acquire</div><div style={{fontFamily:MONO,fontSize:10,color:C.textMute}}>From {oppT.name}</div></>}
        </button>
      </div>}
      <button onClick={analyze} disabled={!myP.length||!oppP.length||ana} style={{width:"100%",background:myP.length&&oppP.length?C.accentDim:C.card,border:"1px solid "+(myP.length&&oppP.length?C.accentBorder:C.border),borderRadius:10,padding:"14px 0",cursor:myP.length&&oppP.length&&!ana?"pointer":"not-allowed",fontFamily:FONT,fontSize:14,fontWeight:600,color:myP.length&&oppP.length?C.accent:C.textMute,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        {ana?<><Spin size={16}/> Analyzing...</>:"Analyze Trade with Advisor"}
      </button>
      {res&&<div style={{marginTop:16,background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:16}}>
        <div style={{fontFamily:MONO,fontSize:9,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Trade Analysis</div>
        <div style={{fontFamily:FONT,fontSize:13,color:C.text,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{res}</div>
      </div>}
      {picker==="my"&&<Picker items={myPlayers} sel={myP} onTog={p=>tog(myP,setMyP,p)} onClose={()=>setPicker(null)} title="Select Your Players"/>}
      {picker==="opp"&&oppT&&<Picker items={oppT.players} sel={oppP} onTog={p=>tog(oppP,setOppP,p)} onClose={()=>setPicker(null)} title={"Select from "+oppT.name}/>}
      {picker==="team"&&<Picker items={oppTeams} sel={oppT?[oppT]:[]} onTog={t=>{setOppT(t);setOppP([]);setPicker(null);}} onClose={()=>setPicker(null)} title="Select Opponent" renderItem={t=><span style={{fontSize:14}}>{t.name}</span>}/>}
    </div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
      {txL&&<div style={{display:"flex",justifyContent:"center",padding:40}}><Spin/></div>}
      {!txL&&!txs.length&&<Empty title="No transactions yet" desc="Recent league transactions will appear here"/>}
      {txs.map((tx,i)=><div key={i} style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"12px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontFamily:MONO,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:tx.type==="trade"?C.amber:C.blue,background:tx.type==="trade"?C.amberDim:C.blueDim,padding:"2px 6px",borderRadius:4}}>{tx.type}</span>
          <span style={{fontFamily:MONO,fontSize:10,color:C.textMute}}>{new Date(tx.created).toLocaleDateString()}</span>
        </div>
        <div style={{fontFamily:FONT,fontSize:13,color:C.textSec,lineHeight:1.45}}>{fmtTx(tx)}</div>
      </div>)}
    </div>}
  </div>;
};

          {loadingU?<><Spin size={16}/> Loading...</>:"Load Leagues"}
        </button>
        {uErr&&<div style={{marginTop:8}}><ErrBox msg={uErr}/></div>}
      </div>

      {lgs.length>0&&<div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:16}}>
        <div style={{fontFamily:MONO,fontSize:10,color:C.textMute,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Loaded Leagues ({lgs.length})</div>
        {lgs.map(l=><div key={l.league_id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid "+C.border}}>
          <span style={{fontFamily:FONT,fontSize:14,color:C.text}}>{l.name}</span>
          <span style={{fontFamily:MONO,fontSize:10,color:C.textSec}}>{l._fmt} · {l.total_rosters}T</span>
        </div>)}
      </div>}
    </div>
  </div>;

  return <div>
    <div style={{fontFamily:FONT,fontSize:20,fontWeight:700,color:C.text,marginBottom:16}}>More</div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {[{id:"standings",label:"Standings",d:I.trophy,desc:"League rankings and records"},{id:"settings",label:"Settings",d:I.gear,desc:"Username, API key, league config"}].map(it=>
        <button key={it.id} onClick={()=>setSub(it.id)} style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:"16px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,textAlign:"left"}}>
          <div style={{width:40,height:40,borderRadius:10,background:C.accentDim,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ico d={it.d} size={20} color={C.accent}/></div>
          <div><div style={{fontFamily:FONT,fontSize:15,fontWeight:600,color:C.text,marginBottom:2}}>{it.label}</div><div style={{fontFamily:MONO,fontSize:11,color:C.textMute}}>{it.desc}</div></div>
          <div style={{marginLeft:"auto"}}><Ico d={I.chevron} size={16} color={C.textMute}/></div>
        </button>)}
    </div>
  </div>;
};

// ─── APP ────────────────────────────────────────────────────
function App() {
  const [tab,setTab] = useState("more");
  const [uname,setUname] = useState(()=>localStorage.getItem("da_username")||"");
  const [uid,setUid] = useState(null);
  const [apiKey,setApiKey] = useState(()=>localStorage.getItem("da_apikey")||"");
  const [lgs,setLgs] = useState([]);
  const [selLg,setSelLg] = useState(null);
  const [lcache,setLcache] = useState({});
  const [pc,setPc] = useState(null);
  const [loadU,setLoadU] = useState(false);
  const [loadLg,setLoadLg] = useState(false);
  const [loadPc,setLoadPc] = useState(false);
  const [uErr,setUErr] = useState(null);

  // Fetch players once
  useEffect(()=>{if(pc)return;setLoadPc(true);sfetch("/players/nfl").then(setPc).catch(e=>console.error("Players load failed:",e)).finally(()=>setLoadPc(false));},[]);

  const onLoad = useCallback(async()=>{
    if(!uname.trim())return; setLoadU(true);setUErr(null);
    try{
      const u=await sfetch("/user/"+uname.trim());
      if(!u?.user_id)throw new Error("User not found. Check your Sleeper username.");
      setUid(u.user_id);
      const raw=await sfetch("/user/"+u.user_id+"/leagues/nfl/"+SEASON);
      if(!raw?.length)throw new Error("No leagues found for "+SEASON);
      const enriched=raw.map(l=>{const{format,scoring}=fmtLeague(l.scoring_settings,l.roster_positions);return{...l,_fmt:format,_scr:scoring};});
      setLgs(enriched);setSelLg(enriched[0]);setTab("home");
    }catch(e){setUErr(e.message);}
    finally{setLoadU(false);}
  },[uname]);

  const hasAutoLoaded = useRef(false);
  useEffect(()=>{
    if(hasAutoLoaded.current) return;
    const savedUser = localStorage.getItem("da_username");
    if(savedUser && !uid) { hasAutoLoaded.current=true; onLoad(); }
  },[]);

  useEffect(()=>{
    if(!selLg||!uid)return;const lid=selLg.league_id;if(lcache[lid])return;
    setLoadLg(true);
    Promise.all([sfetch("/league/"+lid+"/rosters"),sfetch("/league/"+lid+"/users")])
      .then(([r,u])=>setLcache(p=>({...p,[lid]:{rosters:r,users:u}})))
      .catch(console.error).finally(()=>setLoadLg(false));
  },[selLg?.league_id,uid]);

  const ld=lcache[selLg?.league_id];
  const rosters=ld?.rosters||[];
  const lusers=ld?.users||[];
  const ur=rosters.find(r=>r.owner_id===uid)||null;
  const st=useMemo(()=>standings(rosters,lusers),[rosters,lusers]);
  const busy=loadPc||loadLg;

  return <div style={{width:"100%",height:"100vh",background:C.bg,color:C.text,fontFamily:FONT,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>
    <div style={{position:"fixed",inset:0,opacity:0.015,pointerEvents:"none",zIndex:0,backgroundImage:'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 256 256\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'n\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/%3E%3C/svg%3E")'}}/>

    <header style={{padding:"calc(env(safe-area-inset-top, 0px) + 16px) 20px 12px",borderBottom:"1px solid "+C.border,position:"relative",zIndex:10,flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:lgs.length?12:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,"+C.accent+",#059669)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:MONO,fontSize:14,fontWeight:800,color:C.bg}}>DA</div>
          <div><div style={{fontFamily:FONT,fontSize:16,fontWeight:700,color:C.text,lineHeight:1.2}}>Dynasty Advisor</div><div style={{fontFamily:MONO,fontSize:9,color:C.textMute,letterSpacing:1,textTransform:"uppercase"}}>Powered by Claude</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {busy&&<Spin size={14}/>}
          <div style={{fontFamily:MONO,fontSize:10,color:C.textMute,background:C.card,padding:"4px 8px",borderRadius:6,border:"1px solid "+C.border}}>{SEASON} NFL</div>
        </div>
      </div>
      {lgs.length>0&&<LgSel lgs={lgs} sel={selLg} pick={setSelLg}/>}
    </header>

    <main style={{flex:1,overflowY:"auto",padding:"16px 20px",paddingBottom:"calc(env(safe-area-inset-bottom, 0px) + 88px)",position:"relative",zIndex:1,display:"flex",flexDirection:"column"}}>
      {!uid&&tab!=="more"?
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flex:1,gap:16,textAlign:"center"}}>
          <div style={{width:56,height:56,borderRadius:14,background:C.accentDim,display:"flex",alignItems:"center",justifyContent:"center"}}><Ico d={I.gear} size={28} color={C.accent}/></div>
          <div><div style={{fontFamily:FONT,fontSize:17,fontWeight:600,color:C.text,marginBottom:4}}>Connect Your Sleeper Account</div><div style={{fontFamily:MONO,fontSize:12,color:C.textMute}}>Go to More → Settings to get started</div></div>
          <button onClick={()=>setTab("more")} style={{background:C.accentDim,border:"1px solid "+C.accentBorder,borderRadius:10,padding:"12px 24px",cursor:"pointer",fontFamily:FONT,fontSize:14,fontWeight:600,color:C.accent}}>Go to Settings</button>
        </div>
      :<>
        {tab==="home"&&<Home lg={selLg} st={st} ur={ur} pc={pc} apiKey={apiKey} username={uname}/>}
        {tab==="roster"&&<Roster ur={ur} pc={pc}/>}
        {tab==="matchup"&&<Matchup lg={selLg} ur={ur} rosters={rosters} lusers={lusers} pc={pc}/>}
        {tab==="trades"&&<Trades lg={selLg} rosters={rosters} lusers={lusers} ur={ur} pc={pc} st={st} apiKey={apiKey}/>}
        {tab==="more"&&<More st={st} lg={selLg} lgs={lgs} onLoad={onLoad} loadingU={loadU} uErr={uErr} uname={uname} setUname={setUname} uid={uid} apiKey={apiKey} setApiKey={setApiKey}/>}
      </>}
    </main>

    <Nav act={tab} go={setTab}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
